<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Savora</title>
<meta property="og:title" content="Savora · The joy of eating well">
<meta property="og:description" content="Keep the places you love in your own notebook, and share the best ones with friends.">
<meta property="og:image" content="https://tomdignac.github.io/savora-legal/img/og-savora.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Savora">
<meta name="twitter:card" content="summary_large_image">
<!--
  Page d'accueil de savora-legal. C'est aussi la « Site URL » de Supabase : le lien de confirmation de l'e-mail
  d'inscription y mène, et un ancien lien « Mot de passe oublié » aussi. La langue suit celle du navigateur
  (fr, en, de, it ; anglais sinon). Polices hébergées ici : aucune requête vers un service tiers.
-->
<style>
  @font-face { font-family: "Playfair Display"; font-weight: 600; font-display: swap; src: url("fonts/playfair-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("fonts/inter-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url("fonts/inter-500.woff2") format("woff2"); }

  :root {
    --bg: #F9F5EF;
    --card: #FCFAF6;
    --ink: #1F3A26;
    --text: #2E2B26;
    --muted: #6E685E;
    --green: #1F4A2A;
    --green-hover: #173A21;
    --pill: #E3EAD7;
    --border: #EBCFBE;
    --logo-tile: #021E17;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg) url("img/fond.jpg") center / cover no-repeat fixed;
    color: var(--text);
    font: 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 32px;
    position: relative; overflow-x: hidden;
  }
  .deco { position: fixed; pointer-events: none; z-index: 0; opacity: .9; }
  .deco.haut { top: -10px; right: -40px; width: min(260px, 38vw); transform: scaleX(-1) rotate(-8deg); }
  .deco.bas { bottom: -20px; left: -30px; width: min(240px, 36vw); }

  header { width: 100%; max-width: 980px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
  .tuile { width: 36px; height: 36px; border-radius: 9px; background: var(--logo-tile); display: grid; place-items: center; }
  .tuile img { width: 26px; height: 26px; }
  .marque { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 26px; color: var(--ink); letter-spacing: .01em; }

  main { flex: 1; display: grid; place-items: center; width: 100%; position: relative; z-index: 1; padding: 24px 0; }
  .carte {
    width: 100%; max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 18px 40px -24px rgba(60, 40, 20, .35);
    padding: 28px 28px 24px;
    text-align: center;
  }
  .pastille {
    display: inline-block; background: var(--pill); color: var(--ink);
    font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px;
  }
  .illustration { display: block; width: 78%; max-width: 300px; height: auto; margin: 14px auto 6px; }
  h1 {
    font-family: "Playfair Display", Georgia, serif; font-weight: 600;
    color: var(--ink); font-size: clamp(26px, 6.4vw, 34px); line-height: 1.15; margin: 6px 0 10px;
  }
  .texte { margin: 0 auto 22px; max-width: 36ch; }
  .bouton {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 48px; padding: 0 28px; border-radius: 14px;
    background: var(--green); color: #fff; text-decoration: none; font-weight: 500; font-size: 17px;
  }
  .bouton:hover, .bouton:focus-visible { background: var(--green-hover); }
  .bouton:focus-visible { outline: 3px solid #9DB58C; outline-offset: 3px; }
  .note { color: var(--muted); font-size: 14px; margin: 16px 0 0; }

  footer { text-align: center; position: relative; z-index: 1; }
  .devise { font-family: "Playfair Display", Georgia, serif; color: var(--ink); font-size: 18px; margin: 0 0 6px; }
  .liens { color: var(--muted); font-size: 14px; margin: 0; }
  .liens a { color: var(--muted); text-decoration: none; }
  .liens a:hover { text-decoration: underline; }
  .liens span { margin: 0 8px; }

  @media (max-width: 480px) {
    .carte { padding: 22px 18px 20px; border-radius: 18px; }
    .deco.haut { opacity: .55; }
    .deco.bas { opacity: .55; }
  }
</style>
</head>
<body>
  <img class="deco haut" src="img/branche-trait.png" alt="">
  <img class="deco bas" src="img/branche-douce.png" alt="">

  <header>
    <span class="tuile"><img src="img/savora-symbol.svg" alt=""></span>
    <span class="marque">savora</span>
  </header>

  <main>
    <section class="carte" aria-live="polite">
      <span class="pastille" data-t="pastille">E-mail vérifié</span>
      <img class="illustration" src="img/enveloppe.png" alt="" width="640" height="410">
      <h1 data-t="titre">Ton e-mail est confirmé !</h1>
      <p class="texte" data-t="texte">Bienvenue chez Savora. Ton compte est prêt : retourne dans l’app et touche « J’ai vérifié, continuer ».</p>
      <a class="bouton" href="savora://" data-t="bouton">Ouvrir Savora →</a>
      <p class="note" data-t="note">Tu peux fermer cette page.</p>
    </section>
  </main>

  <footer>
    <p class="devise" data-t="devise">Savora · Le plaisir de bien manger</p>
    <p class="liens">
      <a href="confidentialite/" data-t="confidentialite">Confidentialité</a><span>·</span><a href="cgu/" data-t="cgu">Conditions d’utilisation</a>
    </p>
  </footer>

<script>
(function () {
  var T = {
    fr: {
      confirme: { pastille: "E-mail vérifié", titre: "Ton e-mail est confirmé !", texte: "Bienvenue chez Savora. Ton compte est prêt : retourne dans l’app et touche « J’ai vérifié, continuer »." },
      motdepasse: { pastille: "Mot de passe", titre: "Choisis ton nouveau mot de passe dans l’app", texte: "Ce lien s’ouvre dans l’app Savora. Ouvre l’e-mail sur le téléphone où Savora est installée, ou demande un nouveau lien depuis l’app." },
      expire: { pastille: "Lien expiré", titre: "Ce lien n’est plus valable", texte: "Il a déjà servi ou il a expiré. Retourne dans l’app Savora pour en demander un nouveau." },
      bouton: "Ouvrir Savora →", note: "Tu peux fermer cette page.", devise: "Savora · Le plaisir de bien manger",
      confidentialite: "Confidentialité", cgu: "Conditions d’utilisation"
    },
    en: {
      confirme: { pastille: "Email verified", titre: "Your email is confirmed!", texte: "Welcome to Savora. Your account is ready: go back to the app and tap “I have verified, continue”." },
      motdepasse: { pastille: "Password", titre: "Choose your new password in the app", texte: "This link opens in the Savora app. Open the email on the phone where Savora is installed, or request a new link from the app." },
      expire: { pastille: "Link expired", titre: "This link is no longer valid", texte: "It has already been used or it has expired. Go back to the Savora app to request a new one." },
      bouton: "Open Savora →", note: "You can close this page.", devise: "Savora · The joy of eating well",
      confidentialite: "Privacy", cgu: "Terms of Service"
    },
    de: {
      confirme: { pastille: "E-Mail bestätigt", titre: "Deine E-Mail ist bestätigt!", texte: "Willkommen bei Savora. Dein Konto ist bereit: Geh zurück in die App und tippe auf „Ich habe bestätigt, weiter“." },
      motdepasse: { pastille: "Passwort", titre: "Wähle dein neues Passwort in der App", texte: "Dieser Link öffnet sich in der Savora-App. Öffne die E-Mail auf dem Telefon, auf dem Savora installiert ist, oder fordere in der App einen neuen Link an." },
      expire: { pastille: "Link abgelaufen", titre: "Dieser Link ist nicht mehr gültig", texte: "Er wurde schon benutzt oder ist abgelaufen. Geh zurück in die Savora-App und fordere einen neuen an." },
      bouton: "Savora öffnen →", note: "Du kannst diese Seite schließen.", devise: "Savora · Die Freude am guten Essen",
      confidentialite: "Datenschutz", cgu: "Nutzungsbedingungen"
    },
    it: {
      confirme: { pastille: "Email verificata", titre: "La tua email è confermata!", texte: "Benvenuto su Savora. Il tuo account è pronto: torna nell’app e tocca «Ho verificato, continua»." },
      motdepasse: { pastille: "Password", titre: "Scegli la nuova password nell’app", texte: "Questo link si apre nell’app Savora. Apri l’email sul telefono dove è installata Savora, oppure chiedi un nuovo link dall’app." },
      expire: { pastille: "Link scaduto", titre: "Questo link non è più valido", texte: "È già stato usato o è scaduto. Torna nell’app Savora per chiederne uno nuovo." },
      bouton: "Apri Savora →", note: "Puoi chiudere questa pagina.", devise: "Savora · Il piacere di mangiare bene",
      confidentialite: "Privacy", cgu: "Condizioni d’uso"
    }
  };

  // Langue : la première langue du navigateur parmi fr, en, de, it ; anglais sinon. ?lang=xx pour forcer.
  var forced = (new URLSearchParams(location.search).get("lang") || "").slice(0, 2);
  var prefs = [forced].concat(navigator.languages || [navigator.language || ""]);
  var lang = "en";
  for (var i = 0; i < prefs.length; i++) {
    var c = String(prefs[i] || "").slice(0, 2).toLowerCase();
    if (T[c]) { lang = c; break; }
  }

  // Cas : Supabase ajoute des informations après « # » (type=recovery, ou une erreur si le lien a expiré).
  var h = new URLSearchParams(location.hash.replace(/^#/, ""));
  var q = new URLSearchParams(location.search);
  var cas = "confirme";
  if (h.get("error") || h.get("error_code") || q.get("error")) cas = "expire";
  else if (h.get("type") === "recovery" || q.get("type") === "recovery") cas = "motdepasse";

  // On efface ce qui suit « # » de la barre d'adresse : il peut contenir un jeton de session.
  if (location.hash && history.replaceState) history.replaceState(null, "", location.pathname + location.search);

  var d = T[lang];
  document.documentElement.lang = lang;
  var map = { pastille: d[cas].pastille, titre: d[cas].titre, texte: d[cas].texte, bouton: d.bouton, note: d.note,
              devise: d.devise, confidentialite: d.confidentialite, cgu: d.cgu };
  var els = document.querySelectorAll("[data-t]");
  for (var j = 0; j < els.length; j++) { var k = els[j].getAttribute("data-t"); if (map[k]) els[j].textContent = map[k]; }
})();
</script>
</body>
</html>
